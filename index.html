<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base</title>
<meta name="description" content="A personal, searchable knowledge base.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="src/config.js"></script>
<script>
  // Apply theme before first paint to avoid a flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem("kb-theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>

<header class="topbar">
  <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">☰</button>
  <div class="topbar-brand">
    <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="3" y="6" width="14" height="15" rx="2" transform="rotate(-6 3 6)" fill="currentColor" opacity="0.35"/>
      <rect x="5" y="4" width="15" height="16" rx="2" fill="currentColor"/>
    </svg>
    <span id="brand-title">Knowledge Base</span>
    <span class="tagline" id="brand-tagline"></span>
  </div>
  <div class="topbar-search" id="topbar-search"></div>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
</header>

<div class="backdrop" id="backdrop"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div id="sidebar-nav"><div class="skeleton" style="height:20px"></div></div>
  </nav>
  <main class="content" id="content"></main>
</div>

<button class="back-to-top" id="back-to-top" aria-label="Back to top">↑</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
